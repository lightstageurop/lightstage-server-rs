[package]
  authors = ["Thomas Aldrian <thomas.aldrian24@imperial.ac.uk>"]
  description = "Light Stage Control Server"
  edition.workspace = true
  license = "MIT"
  name = "lsserver"
  publish = false
  rust-version.workspace = true
  version = "0.3.0"

[features]
  default = []
  gpio = ["dep:rppal"]

[dependencies]
  anyhow = "1.0.104"
  libc = "0.2.189"
  tokio = { version = "1.53.1", features = ["full"] }
  tracing = "0.1.44"
  tracing-journald = "0.3.2"
  tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

  # need master for async feature
  self_update = { git = "https://github.com/jaemk/self_update", branch = "master", features = [
    "async",
  ] }

  # KiNET
  kinetrs = { path = "../kinetrs" }

  # API
  axum = { version = "0.8.9", features = ["ws"] }
  axum-cbor = "0.1.1"
  ciborium = "0.2.2"
  clap = { version = "4.6.4", features = ["derive", "env"] }
  local-ip-address = "0.6.13"
  serde = { version = "1.0.229", features = ["derive"] }
  ulid = { version = "3.0.0", features = ["serde"] }
  utoipa = { version = "5.5.0", features = ["axum_extras"] }
  utoipa-axum = "0.2.0"
  utoipa-rapidoc = { version = "6.0.0", features = ["axum"] }
  utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
  zstd = "0.13.3"

  # DSLRs
  rppal = { version = "0.22.1", optional = true }
