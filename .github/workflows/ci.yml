name: Build

on:
  push:
    branches:
      - master
    tags:
      - "lsserver-v*"
  pull_request:

permissions:
  contents: write

jobs:
  build-ui:
    name: Build Svelte/Vite UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UI
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/lightstage-js

      - name: Install pnpm
        uses: pnpm/setup@v2
        with:
          version: next-12 # FIXME: npm is dumb and some tags are broken.
          runtime: node@latest
          cache: true
          install: true

      - name: Build Vite App
        run: |
          pnpm build

      - name: Upload UI Assets
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: packages/lightstage-ui/dist

  test:
    name: Run Workspace Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "x86_64-unknown-linux-gnu" # share with build x86_64 job

      - name: Rust Cargo Tests
        run: cargo test --workspace --locked

  build:
    name: Build and upload lsserver
    needs: [test, build-ui]
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            features: ""
          - target: aarch64-unknown-linux-gnu
            features: "--features gpio"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download UI Assets
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: lsserver/ui-dist

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}

      - name: Install cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build lsserver
        run: cargo build --release -p lsserver --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Create archive
        run: |
          tar -czf lsserver-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release lsserver

      - name: Upload lsserver
        uses: actions/upload-artifact@v7
        with:
          path: lsserver-${{ matrix.target }}.tar.gz
          archive: false

  release:
    name: Publish Release for lsserver
    needs: build
    if: startsWith(github.ref, 'refs/tags/lsserver-v') # only on tag
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: lsserver-*.tar.gz
          merge-multiple: true # put all artifacts in same dir

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
